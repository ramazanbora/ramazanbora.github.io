- id: metropolitan-reform
  title: "A High-Resolution View of the Hinterland: Local Government Centralization and Rural Development in Turkey"
  category: "Job market paper"
  status: "Job market paper"
  authors: "Ramazan Bora"
  url: /research/hinterland-abstract/
  paper_file: /files/Bora_JMP.pdf
  summary: "Turkey’s 2012 reform placed thousands of villages under metropolitan governments. I reconstruct village boundaries and link them to satellite night lights and population registers, comparing villages on either side of provincial borders. Villages in newly created metropolitan provinces are about 11% brighter a decade after the reform, and treated villages retain about 10% more of their population."
  paragraphs:
    - "Turkey’s 2012 metropolitan reform created 14 new metropolitan provinces, extended existing metropolitan jurisdictions to provincial borders and abolished village self-government within them. I reconstruct village boundary polygons for thousands of villages and link them to VIIRS night lights, population registers, a daily satellite proxy for power outages and driving times to administrative centres."
    - "A contiguous-border difference-in-differences design compares villages on either side of treated and untreated provincial frontiers. I find that villages in newly created metropolitan provinces are about 11% brighter a decade after the reform and that treated villages retain about 10% more of their population. There is no consistent gain in night lights where existing metropolitan governments had their territory expanded, and a penalty for distance from the administrative centre fades over time."
    - "Presented at the SIOE annual conference (2025) and the ANU PhD Conference in Economics and Business (2024). I am revising the paper for journal submission."

- id: cues-from-below
  title: "Cues from Below: How Judgments in Intermediate Appellate Courts Signal Special Leave Prospects in the High Court of Australia"
  category: "Papers"
  status: "Manuscript, 2026"
  authors: "Ramazan Bora and Russell Smyth"
  coauthors: "Russell Smyth"
  url: /research/cues-from-below/
  summary: "We ask whether the judgment of an intermediate appellate court carries cues about an application’s prospects of special leave to appeal to the High Court of Australia. In 43,595 judgments linked to 4,223 applications, each cue we measure is associated with leave being sought and with leave being granted; where a judge dissented below, the grant rate among applications is more than twice as high."
  paragraphs:
    - "The High Court of Australia grants special leave to appeal in a small fraction of applications, usually gives only brief reasons, and since December 2023 ordinarily decides applications on the papers. Practitioners describe the criteria as opaque. Our framing draws on cue theory from the literature on the United States Supreme Court: a court with limited time looks for cues in the judgment below."
    - "We built a corpus of 43,595 judgments from five intermediate appellate courts, 2000 to 2026, about 2.86 million paragraphs, and linked it to 4,223 special-leave applications and their outcomes. Starting from all appellate judgments, and not only from applications, lets us separate two decisions that earlier work could not: the litigant’s decision to apply and the Court’s decision to grant. For each judgment we measure dissent on the orders, length, the number and type of authorities cited, and whether a judge said that the question belongs to the High Court or flagged a gap, a conflict or a difficulty in the law."
    - "Each cue is associated with both decisions. Applications were about twice as frequent where there was a dissent, and 33% of those applications were granted, against 14% where the court below agreed on the orders. An express statement that the issue is one for the High Court appears in only 237 judgments, yet it is among the strongest correlates of a grant when the other cues are held constant."
    - "The measures were produced with language models. Reading 280 million words with the most capable model would have been unaffordable, so each measure runs as a cascade: a mechanical screen, a low-cost model that extracts or flags, and a stronger model that decides. We cross-checked the dissent classifications against the existing High Court Database, and extending that validation with a human-coded sample across all measures is the next step."
    - "The corpus was designed as a research base for a programme of work, not as the dataset for one paper: the text is held at paragraph level and linked to citations, applications and outcomes. The paper will be presented at the workshop Accessing Judicial Power in the Australian Political System at the Australian National University in December 2026."

- id: birthplace
  title: "Birthplace Favoritism Revisited: Replication, Modern Evidence, and Crisis Dynamics"
  category: "Papers"
  status: "UQ School of Economics Discussion Paper No. 671, 2025"
  authors: "Ramazan Bora"
  url: /research/birthplace-abstract/
  paper_url: https://economics.uq.edu.au/files/54118/671.pdf
  record_url: https://ideas.repec.org/p/qld/uq2004/671.html
  summary: "I replicate Hodler and Raschky (2014) using only open data and extend the analysis to monthly satellite night lights for 2012–2025. The premium enjoyed by a national leader’s birth region persists in the modern data, appears on accession and does not disappear when the leader leaves office."
  paragraphs:
    - "I replicate Hodler and Raschky (2014) using only open data, then extend the analysis to monthly VIIRS night lights for 2012–2025. The premium enjoyed by a national leader’s birth region persists in the modern data, appears on accession and does not disappear when the leader leaves office."
    - "A sharp rise in the premium at the onset of COVID-19 turns out, under placebo reassignment, to be partly a population-density artefact. After country-by-month-by-density fixed effects and a comparison with regions that produced past leaders, a premium remains, concentrated in countries with weaker democratic institutions. The linked paper is the discussion-paper version of November 2025."

- id: ramadan-chess
  title: "Measuring Cognition at Scale: The Association Between Ramadan Exposure and Chess Performance"
  category: "Papers"
  status: "Working paper"
  authors: "Ramazan Bora"
  url: /research/ramadan-chess-abstract/
  summary: "I score 16 million moves from 800,000 online chess games against a chess engine. Players with Muslim-majority-country flags make about 1% fewer errors during Ramadan, move faster and shift their play towards the night."
  paragraphs:
    - "A panel of 16 million moves from 800,000 online chess games, each move scored against the Stockfish engine, which gives a consistent measure of decision quality within a player over time."
    - "In a difference-in-differences design with player and period fixed effects, players with Muslim-majority-country flags make about 1% fewer errors during Ramadan, move faster and shift play towards the night. The association is concentrated among lower-rated and less experienced players."

- id: integerisation
  title: "A Novel Integerisation Procedure for Population Data"
  category: "Work in progress"
  status: "Work in progress"
  authors: "Ramazan Bora and Pia Wohland"
  coauthors: "Pia Wohland"
  summary: "A method for converting fractional estimates from iterative proportional fitting into whole numbers that satisfy every marginal constraint. It grew out of the population estimates we produced for the Queensland Government Statistician’s Office."
