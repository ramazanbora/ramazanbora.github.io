# Personal academic website, built by GitHub Pages with Jekyll.
locale: en-AU
title: Ramazan Bora
name: Ramazan Bora
description: "Ramazan Bora is an applied economist at Monash University who studies political economy and institutions using data he builds from satellite imagery, administrative records and court judgments."
url: https://ramazanbora.com
baseurl: ""
repository: ramazanbora/ramazanbora.github.io
content_updated: 2026-11-20
cv_pdf: /files/Ramazan_Bora_CV.pdf
google_analytics: G-PJKZPC7G95

